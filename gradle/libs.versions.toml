[versions]
agp = "9.5.1"
firebaseBom = "34.3.0"
kotlin = "2.4.21"
coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
lifecycle = "2.9.4"
room = "2.8.5"
sqlite = "2.7.1"
ksp = "2.3.13"
activityCompose = "1.8.0"
composeBom = "2026.09.00" # ui 1.12.1, la misma que usa Compose MP 1.12.2
kotlinxCoroutines = "1.11.0"
kermit = "2.2.0"
# New versions
coil = "2.7.0"
playServicesAds = "23.0.0"
datastorePreferences = "1.3.0"
koin = "4.2.2"
navigationCompose = "2.9.4"
